<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Super admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="tela-login" class="tela-centro oculto">
    <form id="form-login" class="cartao login">
      <h1>Super admin</h1>
      <label>E-mail <input type="email" id="email" required autocomplete="username"></label>
      <label>Senha <input type="password" id="senha" required autocomplete="current-password"></label>
      <p id="erro-login" class="erro"></p>
      <button class="btn btn-bloco" type="submit">Entrar</button>
    </form>
  </div>

  <div id="tela-admin" class="oculto">
    <header class="barra">
      <div class="barra-conteudo">
        <strong>Super admin · seus clientes</strong>
        <button id="btn-sair" class="btn btn-sec btn-pequeno" type="button">Sair</button>
      </div>
    </header>

    <main class="container largo">
      <section class="cartao">
        <h2>Cadastrar novo negócio</h2>
        <form id="form-novo">
          <div class="linha-form">
            <label>Nome do negócio <input name="nome" required maxlength="80" placeholder="Barbearia do Zé"></label>
            <label>Endereço na URL (slug) <input name="slug" required maxlength="50" placeholder="barbearia-do-ze"></label>
          </div>
          <div class="linha-form">
            <label>Tipo
              <select name="tipo">
                <option value="barbearia">Barbearia</option>
                <option value="salao">Salão de beleza</option>
                <option value="petshop">Pet shop</option>
                <option value="clinica">Clínica</option>
                <option value="academia">Academia / personal</option>
                <option value="outro">Outro</option>
              </select>
            </label>
            <label>Plano
              <select name="plano">
                <option value="basico">Básico</option>
                <option value="premium">Premium</option>
              </select>
            </label>
            <label>WhatsApp do negócio <input name="whatsapp" type="tel" placeholder="(11) 99999-9999"></label>
          </div>
          <div class="linha-form">
            <label>E-mail do dono <input name="email" type="email" required></label>
            <label>Senha inicial <input name="senha" type="text" required minlength="6" placeholder="mín. 6 caracteres"></label>
          </div>
          <p id="novo-msg" class="muted"></p>
          <button class="btn" type="submit">Criar negócio e acesso do dono</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Negócios cadastrados <span id="contagem" class="muted"></span></h2>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr><th>Negócio</th><th>Tipo</th><th>Plano</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="lista-negocios"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
